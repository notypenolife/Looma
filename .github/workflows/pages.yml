name: Publish Looma
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Looma-source.zip", ".github/workflows/pages.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Extract reviewed static build
        run: unzip -q Looma-source.zip -d looma
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: looma/out
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
